<nav class="domain-nav" aria-label="Domains">{% for domain in ui.domains %}<a class="domain-item{% if not domain.enabled and ui.off_style == 'greyed' %} off{% endif %}" href="{{ domain.url }}"{% if domain.current %} aria-current="page"{% endif %}>{% include 'core/components/icon.html' with name=domain.slug only %}<span>{{ domain.label }}</span>{% if not domain.enabled %}<span class="sr-only"> — arrives later</span>{% endif %}</a>{% endfor %}</nav>
