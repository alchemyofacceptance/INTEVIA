# S015 verification route in CI. It runs the same entry point as local verification (python -m verification.run) and
# publishes its evidence. The job's check fails on FAIL, INCOMPLETE or a cleanup problem; the summary says which.
# A passing check is evidence for the tested commit and environment. It is not review, landing or Human acceptance.
name: S015 verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s015:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: intevia
          POSTGRES_PASSWORD: intevia-ci-disposable
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intevia -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      INTEVIA_POSTGRES_HOST: 127.0.0.1
      INTEVIA_POSTGRES_PORT: "5432"
      INTEVIA_POSTGRES_USER: intevia
      # A throwaway password for the job's own service container; it protects nothing outside this job.
      INTEVIA_POSTGRES_PASSWORD: intevia-ci-disposable
      INTEVIA_POSTGRES_DB: postgres
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned verification environment
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements-verification.txt

      - name: Run the S015 verification route
        id: route
        run: |
          set +e
          python -m verification.run --evidence-dir verification-evidence --run-id "gh${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          status=$?
          echo "exit_status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish the summary
        if: always()
        run: |
          if [ -f verification-evidence/SUMMARY.md ]; then
            cat verification-evidence/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No evidence summary was written: the route did not complete setup. Treat this run as INCOMPLETE." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s015-verification-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: verification-evidence/
          if-no-files-found: warn
          retention-days: 90

      - name: Fail the check unless the route passed and cleanup was clean
        if: always()
        run: |
          status="${{ steps.route.outputs.exit_status }}"
          case "$status" in
            0) echo "PASS: every step passed and cleanup was clean." ;;
            1) echo "FAIL: at least one step failed. See the summary and evidence."; exit 1 ;;
            2) echo "INCOMPLETE: at least one step could not be completed. See the summary and evidence."; exit 1 ;;
            3) echo "CLEANUP NOT CLEAN: see the summary and evidence."; exit 1 ;;
            *) echo "INCOMPLETE: the route did not report an exit status ($status)."; exit 1 ;;
          esac
